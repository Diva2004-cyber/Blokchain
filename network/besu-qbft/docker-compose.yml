version: "3.8"

networks:
  besu-consortium-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # Validator 1 - Universitas Indonesia Sintetis
  validator1-uis:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator1-uis
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
    networks:
      besu-consortium-net:
        ipv4_address: 172.20.0.11
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --network-id=13371
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
    ports:
      - "8545:8545"

  # Validator 2 - Institut Teknologi Bandung Sintetis
  validator2-itbs:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator2-itbs
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
    networks:
      besu-consortium-net:
        ipv4_address: 172.20.0.12
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --network-id=13371
      - --bootnodes=enode://9e688319656e0d104a65b269e5273a30718d159c@172.20.0.11:30303

  # Validator 3 - Universitas Gadjah Mada Sintetis
  validator3-ugms:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator3-ugms
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
    networks:
      besu-consortium-net:
        ipv4_address: 172.20.0.13
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --network-id=13371
      - --bootnodes=enode://9e688319656e0d104a65b269e5273a30718d159c@172.20.0.11:30303

  # Validator 4 - LLDIKTI / Dewan Tata Kelola Konsorsium
  validator4-governance:
    image: hyperledger/besu:24.1.0
    container_name: besu-validator4-governance
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ./genesis.json:/opt/besu/genesis.json
    networks:
      besu-consortium-net:
        ipv4_address: 172.20.0.14
    command:
      - --genesis-file=/opt/besu/genesis.json
      - --network-id=13371
      - --bootnodes=enode://9e688319656e0d104a65b269e5273a30718d159c@172.20.0.11:30303
