<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <marker id="arrowBtc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <text x="475" y="45" font-size="22" font-weight="800" fill="url(#headerGrad)" text-anchor="middle">MODEL TRANSAKSI BITCOIN UTXO (UNSPENT TRANSACTION OUTPUT)</text>
  <text x="475" y="75" font-size="13" fill="#94a3b8" text-anchor="middle">Konsumsi Input Total, Penciptaan Output, Alamat Kembalian (Change), dan Biaya Penambang (Fee)</text>

  <!-- Connectors -->
  <line x1="260" y1="250" x2="350" y2="250" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowBtc)" />
  <line x1="590" y1="210" x2="680" y2="170" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowBtc)" />
  <line x1="590" y1="290" x2="680" y2="330" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowBtc)" />
  <line x1="470" y1="360" x2="470" y2="440" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#arrowBtc)" />

  <!-- 1. Input Box -->
  <rect x="40" y="170" width="220" height="160" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <rect x="40" y="170" width="220" height="35" rx="10" fill="#2563eb" />
  <text x="150" y="193" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">INPUT UTXO (Terkonsumsi)</text>

  <text x="55" y="230" font-size="12" font-weight="600" fill="#93c5fd">TX-GEN-00 : Index 0</text>
  <text x="55" y="255" font-size="14" font-weight="800" fill="#f8fafc">1.5000 BTC</text>
  <text x="55" y="275" font-size="11" fill="#94a3b8">150.000.000 Satoshi</text>
  <text x="55" y="305" font-size="10" fill="#64748b">Terkunci: Kas Kampus Master</text>

  <!-- 2. Transaction Box -->
  <rect x="350" y="140" width="240" height="220" rx="12" fill="#182234" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)" />
  <rect x="350" y="140" width="240" height="40" rx="12" fill="#d97706" />
  <text x="470" y="165" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">TRANSAKSI: TX-SIM-01</text>

  <text x="370" y="205" font-size="11" fill="#cbd5e1">• Total Input : 1.5000 BTC</text>
  <text x="370" y="230" font-size="11" fill="#cbd5e1">• Total Output: 1.4995 BTC</text>
  <text x="370" y="260" font-size="11" font-weight="700" fill="#f87171">• Miner Fee Implisit:</text>
  <text x="385" y="280" font-size="12" font-weight="800" fill="#fca5a5">0.0005 BTC (50k Sats)</text>
  <text x="370" y="310" font-size="10" fill="#94a3b8">• Virtual Size: 215 vBytes</text>
  <text x="370" y="330" font-size="10" fill="#94a3b8">• Fee Rate: 232.55 sat/vB</text>

  <!-- 3. Output 0 Box -->
  <rect x="680" y="90" width="230" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <rect x="680" y="90" width="230" height="35" rx="10" fill="#059669" />
  <text x="795" y="113" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">OUTPUT 0: UTXO BARU</text>

  <text x="695" y="150" font-size="12" font-weight="600" fill="#a7f3d0">Penerima Beasiswa</text>
  <text x="695" y="175" font-size="14" font-weight="800" fill="#f8fafc">0.1000 BTC</text>
  <text x="695" y="195" font-size="11" fill="#94a3b8">10.000.000 Satoshi</text>
  <text x="695" y="225" font-size="10" fill="#34d399">Status: UNSPENT (Dapat Dibelanjakan)</text>

  <!-- 4. Output 1 Change Box -->
  <rect x="680" y="260" width="230" height="150" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)" />
  <rect x="680" y="260" width="230" height="35" rx="10" fill="#7c3aed" />
  <text x="795" y="283" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">OUTPUT 1: KEMBALIAN (CHANGE)</text>

  <text x="695" y="320" font-size="12" font-weight="600" fill="#ddd6fe">Kembalian Kas Kampus</text>
  <text x="695" y="345" font-size="14" font-weight="800" fill="#f8fafc">1.3995 BTC</text>
  <text x="695" y="365" font-size="11" fill="#94a3b8">139.950.000 Satoshi</text>
  <text x="695" y="395" font-size="10" fill="#c084fc">Status: UNSPENT (Kembali ke Dompet)</text>

  <!-- 5. Miner Reward Box -->
  <rect x="350" y="440" width="240" height="100" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
  <text x="470" y="470" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle">MINER REWARD / FEE</text>
  <text x="470" y="495" font-size="12" fill="#fee2e2" text-anchor="middle">Selisih: Input - Output = 0.0005 BTC</text>
  <text x="470" y="520" font-size="10" fill="#f87171" text-anchor="middle">Masuk ke Transaksi Coinbase Penambang</text>
</svg>
