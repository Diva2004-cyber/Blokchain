<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="govGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="550" y="45" font-size="24" font-weight="800" fill="url(#headerGrad)" text-anchor="middle">ARSITEKTUR KONSORSIUM KREDENSIAL AKADEMIK TERDISTRIBUSI</text>
  <text x="550" y="75" font-size="14" fill="#94a3b8" text-anchor="middle">Permissioned Consortium Blockchain (Hyperledger Besu QBFT) &amp; W3C Verifiable Credentials</text>

  <!-- Layer 1: User / Presentation Layer -->
  <rect x="50" y="105" width="1000" height="135" rx="12" fill="#131d31" stroke="#334155" stroke-dasharray="4" />
  <text x="70" y="130" font-size="14" font-weight="700" fill="#38bdf8">1. Presentation Layer (Antarmuka Web Next.js 15)</text>

  <!-- Cards -->
  <rect x="70" y="145" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" filter="url(#shadow)" />
  <text x="210" y="175" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Issuer Dashboard</text>
  <text x="210" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">Input Nilai &amp; Anchoring On-Chain</text>

  <rect x="410" y="145" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#2dd4bf" filter="url(#shadow)" />
  <text x="550" y="175" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Holder Wallet (Off-Chain)</text>
  <text x="550" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">Simpan W3C VC &amp; Buat Presentasi VP</text>

  <rect x="750" y="145" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" filter="url(#shadow)" />
  <text x="890" y="175" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Verifier Portal</text>
  <text x="890" y="200" font-size="12" fill="#94a3b8" text-anchor="middle">Verifikasi 6-Lapis &amp; Cek Replay</text>

  <!-- Layer 2: API & Service Layer -->
  <rect x="50" y="265" width="1000" height="135" rx="12" fill="#131d31" stroke="#334155" stroke-dasharray="4" />
  <text x="70" y="290" font-size="14" font-weight="700" fill="#818cf8">2. Application Service Layer (Node.js / TypeScript Core)</text>

  <rect x="70" y="305" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#818cf8" filter="url(#shadow)" />
  <text x="210" y="335" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Issuance Service</text>
  <text x="210" y="360" font-size="12" fill="#94a3b8" text-anchor="middle">Kanonisasi RFC 8785 &amp; ECDSA</text>

  <rect x="410" y="305" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#818cf8" filter="url(#shadow)" />
  <text x="550" y="335" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Verification Service</text>
  <text x="550" y="360" font-size="12" fill="#94a3b8" text-anchor="middle">6-Layer Check &amp; Nonce Replay Defense</text>

  <rect x="750" y="305" width="280" height="80" rx="8" fill="url(#cardGrad)" stroke="#818cf8" filter="url(#shadow)" />
  <text x="890" y="335" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle">Lifecycle &amp; Audit Service</text>
  <text x="890" y="360" font-size="12" fill="#94a3b8" text-anchor="middle">Suspend, Revoke, Event Reconstruction</text>

  <!-- Layer 3: Off-Chain Storage -->
  <rect x="50" y="425" width="1000" height="95" rx="12" fill="#131d31" stroke="#0d9488" stroke-dasharray="2" />
  <text x="70" y="450" font-size="14" font-weight="700" fill="#2dd4bf">3. Off-Chain Storage (Zero PII on Ledger — UU No. 27/2022)</text>
  <text x="550" y="485" font-size="13" fill="#cbd5e1" text-anchor="middle">
    Data Pribadi Mahasiswa (Nama, NIK, IPK, Transkrip Lengkap) disimpan 100% pada Dompet Digital Pemegang &amp; Database Kampus
  </text>

  <!-- Layer 4: Blockchain Consortium Layer -->
  <rect x="50" y="545" width="1000" height="270" rx="12" fill="#131d31" stroke="#7c3aed" />
  <text x="70" y="575" font-size="15" font-weight="700" fill="#c084fc">4. Permissioned Consortium Blockchain Layer (Hyperledger Besu QBFT — Chain ID 13371)</text>

  <!-- Smart Contract -->
  <rect x="70" y="595" width="960" height="60" rx="8" fill="#1e1b4b" stroke="#a855f7" />
  <text x="550" y="625" font-size="15" font-weight="700" fill="#f3e8ff" text-anchor="middle">Smart Contract: CredentialRegistry.sol (Solidity 0.8.30)</text>
  <text x="550" y="645" font-size="12" fill="#d8b4fe" text-anchor="middle">Hanya Mencatat: bytes32 credentialId, bytes32 commitment (keccak256), uint8 status, string issuerId</text>

  <!-- 4 Quorum Validators -->
  <rect x="70" y="675" width="220" height="120" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)" />
  <text x="180" y="705" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Validator 1: UIS</text>
  <text x="180" y="725" font-size="11" fill="#bae6fd" text-anchor="middle">Universitas Indonesia Sintetis</text>
  <text x="180" y="745" font-size="10" fill="#e0f2fe" text-anchor="middle">172.20.0.11 : 8545</text>
  <text x="180" y="770" font-size="11" font-weight="600" fill="#fef08a" text-anchor="middle">Validator &amp; Issuer</text>

  <rect x="315" y="675" width="220" height="120" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)" />
  <text x="425" y="705" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Validator 2: ITBS</text>
  <text x="425" y="725" font-size="11" fill="#bae6fd" text-anchor="middle">Inst. Teknologi Bandung Sintetis</text>
  <text x="425" y="745" font-size="10" fill="#e0f2fe" text-anchor="middle">172.20.0.12 : 30303</text>
  <text x="425" y="770" font-size="11" font-weight="600" fill="#fef08a" text-anchor="middle">Validator &amp; Issuer</text>

  <rect x="560" y="675" width="220" height="120" rx="8" fill="url(#nodeGrad)" filter="url(#shadow)" />
  <text x="670" y="705" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Validator 3: UGMS</text>
  <text x="670" y="725" font-size="11" fill="#bae6fd" text-anchor="middle">Universitas Gadjah Mada Sintetis</text>
  <text x="670" y="745" font-size="10" fill="#e0f2fe" text-anchor="middle">172.20.0.13 : 30303</text>
  <text x="670" y="770" font-size="11" font-weight="600" fill="#fef08a" text-anchor="middle">Validator &amp; Issuer</text>

  <rect x="805" y="675" width="225" height="120" rx="8" fill="url(#govGrad)" filter="url(#shadow)" />
  <text x="917" y="705" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Validator 4: LLDIKTI</text>
  <text x="917" y="725" font-size="11" fill="#e9d5ff" text-anchor="middle">Dewan Tata Kelola Regulator</text>
  <text x="917" y="745" font-size="10" fill="#f3e8ff" text-anchor="middle">172.20.0.14 : 30303</text>
  <text x="917" y="770" font-size="11" font-weight="600" fill="#fef08a" text-anchor="middle">Governance Admin &amp; Val</text>
</svg>
